<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🦜 翻译鹦鹉</title>
<style>
  :root { --bg:#f7f9fc; --card:#ffffff; --text:#1f2630; --muted:#5a6472; --brand:#e8590c; --line:#dde4ec; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header .logo { font-size:30px; }
  header h1 { font-size:19px; margin:0; }
  header .sub { font-size:12px; color:var(--muted); }
  .input-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .row { display:flex; gap:8px; align-items:center; }
  textarea { width:100%; min-height:56px;max-height:120px; border:none; outline:none; resize:vertical; font-size:17px; background:transparent; color:var(--text); }
  .lang-row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px dashed var(--line); }
  .lang { font-size:13px; color:var(--muted); }
  .swap { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .go { width:100%; margin-top:10px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; padding:11px 0; cursor:pointer; }
  .go:active { opacity:.85; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .trans-main { font-size:22px; font-weight:600; line-height:1.5; }
  .phonetic-row { display:flex; align-items:center; gap:10px; margin-top:6px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
  .speak { border:1px solid var(--line); background:#fff; border-radius:50%; width:30px; height:30px; font-size:14px; cursor:pointer; line-height:1; }
  .sec-title { font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .meaning { font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .meaning:last-child { border-bottom:none; }
  .meaning .pos { display:inline-block; font-size:11px; color:var(--brand); border:1px solid currentColor; border-radius:4px; padding:0 5px; margin-right:6px; vertical-align:1px; }
  .example { font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:flex-start; }
  .example:last-child { border-bottom:none; }
  .example .txt { flex:1; line-height:1.55; }
  .empty { color:var(--muted); font-size:14px; text-align:center; padding:30px 0; }
  .movie-tag { font-size:10px; color:#fff; background:#8746a8; border-radius:4px; padding:1px 5px; margin-left:6px; }
  .err { color:#b02a37; font-size:14px; text-align:center; padding:16px 0; }
</style>
</head>

<script>
window.API_TOKEN = "__API_TOKEN__";
var dirMode = 'auto';
var qEl = document.getElementById('q');
var resultEl = document.getElementById('result');
var dirLabel = document.getElementById('dirLabel');
document.getElementById('swap').addEventListener('click', function () {
  dirMode = dirMode === 'auto' ? 'en2zh' : (dirMode === 'en2zh' ? 'zh2en' : 'auto');
  dirLabel.textContent = dirMode === 'auto' ? '自动检测 → 自动' : (dirMode === 'en2zh' ? '英语 → 中文' : '中文 → 英语');
});
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function audioBtn(url){ return url ? '<button type="button" class="speak" onclick="new Audio(\''+url+'\').play()">🔊</button>' : ''; }
function fromTo(){
  if (dirMode==='en2zh') return ['en','zh-CN'];
  if (dirMode==='zh2en') return ['zh-CN','en'];
  return ['auto',''];
}
var lastAutoPlayUrl = null;
var sysOverlay = document.getElementById('sysOverlay');
document.getElementById('sysBtn').addEventListener('click', function () { sysOverlay.style.display = 'flex'; });
document.getElementById('sysClose').addEventListener('click', function () { sysOverlay.style.display = 'none'; });
sysOverlay.addEventListener('click', function (e) { if (e.target === sysOverlay) sysOverlay.style.display = 'none'; });
function render(d){
  if(!d.ok){ resultEl.innerHTML='<div class="card"><div class="err">'+esc(d.error||'翻译失败')+'</div></div>'; return; }
  var html = '<div class="card">';
  html += '<div class="trans-main">' + esc(d.translation) + '</div>';
  var ph = [];
  if (d.term) ph.push('<span>' + esc(d.term) + (d.phonetic ? ' /' + esc(d.phonetic) + '/' : '') + '</span>');
  ph.push(audioBtn(d.audio_en || ''));
  if (d.audio_zh) ph.push('<span style="font-size:12px">中文</span>' + audioBtn(d.audio_zh));
  if (ph.length) html += '<div class="phonetic-row">' + ph.join('') + '</div>';
  if (d.meanings && d.meanings.length) {
    html += '<div class="sec-title">常用含义</div>';
    d.meanings.forEach(function(m){
      html += '<div class="meaning">' + (m.pos?'<span class="pos">'+esc(m.pos)+'</span>':'') + esc(m.definition) + (m.zh?'<div style="color:var(--brand);font-size:13px;margin-top:2px">'+esc(m.zh)+'</div>':'') + (m.example?'<div style="color:var(--muted);font-size:13px;margin-top:2px">例：'+esc(m.example)+'</div>':'') + '</div>';
    });
  }
  if (d.examples && d.examples.length) {
    html += '<div class="sec-title">常用例句</div>';
    d.examples.forEach(function(ex){
      html += '<div class="example">' + audioBtn(ex.audio) + '<div class="txt">' + esc(ex.en) + (ex.zh?'<div style="color:var(--muted);font-size:13px;margin-top:2px">'+esc(ex.zh)+'</div>':'') + '</div></div>';
    });
  }
  if (d.movie_examples && d.movie_examples.length) {
    html += '<div class="sec-title">影视例句</div>';
    d.movie_examples.forEach(function(ex){
      html += '<div class="example">' + audioBtn(ex.audio) + '<div class="txt">' + esc(ex.en) + '<span class="movie-tag">' + esc(ex.source) + '</span></div></div>';
    });
  }
  html += '</div>';
  resultEl.innerHTML = html;
  if (d.ok && d.audio_en && d.audio_en !== lastAutoPlayUrl) {
    lastAutoPlayUrl = d.audio_en;
    var autoAudio = new Audio(d.audio_en);
    autoAudio.play().catch(function(){});
  }
}
function translate(){
  var q = qEl.value.trim();
  if(!q) return;
  resultEl.innerHTML = '<div class="card"><div class="empty">翻译中…</div></div>';
  var ft = fromTo();
  fetch('api/translate?q=' + encodeURIComponent(q) + '&from=' + ft[0] + '&to=' + ft[1] + '&token=' + encodeURIComponent(window.API_TOKEN || ''))
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ resultEl.innerHTML='<div class="card"><div class="err">网络错误，请重试</div></div>'; });
}
document.getElementById('go').addEventListener('click', translate);
var imgInput = document.getElementById('imgInput');
document.getElementById('ocrBtn').addEventListener('click', function(){ imgInput.click(); });
imgInput.addEventListener('change', function(){
  var file = imgInput.files && imgInput.files[0];
  if (!file) return;
  resultEl.innerHTML = '<div class="card"><div class="empty">识别截图中…</div></div>';
  var fd = new FormData();
  fd.append('image', file);
  var ocrUrl = 'api/ocr-translate?token=' + encodeURIComponent(window.API_TOKEN || '');
  fetch(ocrUrl, { method: 'POST', credentials: 'same-origin', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { resultEl.innerHTML = '<div class="card"><div class="err">'+esc(d.error||'识别失败')+'</div></div>'; return; }
      render(d);
      var pre = document.createElement('div');
      pre.className = 'card';
      pre.innerHTML = '<div class="sec-title" style="margin-top:0">识别到的文字</div><div style="font-size:14px;white-space:pre-wrap;line-height:1.7">' + esc(d.extracted || '') + '</div>';
      resultEl.insertBefore(pre, resultEl.firstChild);
    })
    .catch(function(){ resultEl.innerHTML = '<div class="card"><div class="err">上传失败，请重试</div></div>'; });
  imgInput.value = '';
});
var historyOverlay = document.getElementById('historyOverlay');
var historyList = document.getElementById('historyList');
var histOffset = 0;
var histSort = "time";
var histTotal = 0;
var HIST_PAGE = 50;
function fmtTime(ts) {
  var d = new Date(ts * 1000);
  return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function loadHistoryPage() {
  historyList.innerHTML = '<div style="color:#5a6472;font-size:13px;text-align:center;padding:16px">加载中…</div>';
  var u = 'api/history?limit=50&offset=' + histOffset + '&sort=' + histSort + '&token=' + encodeURIComponent(window.API_TOKEN || '');
  fetch(u)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var items = (d && d.items) || [];
      histTotal = (d && d.total) || 0;
      if (!items.length) {
        historyList.innerHTML = '<div style="color:#5a6472;font-size:13px;text-align:center;padding:16px">' + (histOffset === 0 ? '暂无查询记录' : '没有更多了') + '</div>';
      } else {
        historyList.innerHTML = items.map(function (it) {
          return '<div data-q="' + esc(it.q) + '" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px dashed #dde4ec;cursor:pointer">' +
            '<span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.q) + '</span>' +
            '<span style="font-size:11px;color:#5a6472;flex-shrink:0">' + esc(fmtTime(it.created_at)) + '</span></div>';
        }).join('');
      }
      var page = Math.floor(histOffset / HIST_PAGE) + 1;
      var pages = Math.max(1, Math.ceil(histTotal / HIST_PAGE));
      document.getElementById('histPage').textContent = page + ' / ' + pages;
      document.getElementById('histPrev').disabled = histOffset <= 0;
      document.getElementById('histNext').disabled = histOffset + HIST_PAGE >= histTotal;
    })
    .catch(function () { historyList.innerHTML = '<div style="color:#b02a37;font-size:13px;text-align:center;padding:16px">加载失败</div>'; });
}
document.getElementById('historyBtn').addEventListener('click', function () {
  histOffset = 0;
  historyOverlay.style.display = 'flex';
  loadHistoryPage();
});

var histPlaying = false;
var histPaused = false;
var histPlayAudio = null;
var histPlayTimer = null;
var histCurrent = null;
var histItems = [];
var histIdx = 0;
var histReplayCount = 0;
var histClickTimer = null;
function histPlayUrl(text, lang) {
  return 'api/tts?text=' + encodeURIComponent(text) + '&lang=' + lang +  '&token=' + encodeURIComponent(window.API_TOKEN || '');
}
function histSchedule(fn, ms) {
  histPlayTimer = setTimeout(function () { histPlayTimer = null; fn(); }, ms);
}
function histCancelTimer() {
  if (histPlayTimer) { clearTimeout(histPlayTimer); histPlayTimer = null; }
}
function histPlaySound(url, onDone) {
  histPlayAudio = new Audio(url);
  histPlayAudio.onended = onDone;
  histPlayAudio.onerror = function () { if (histPlaying && !histPaused) histSchedule(onDone, 400); };
  histPlayAudio.play().catch(function () { if (histPlaying && !histPaused) histSchedule(onDone, 400); });
}
function showExampleBar(word, pick) {
  var bar = document.getElementById('playExampleBar');
  if (!bar) return;
  bar.style.position = 'relative';
  bar.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
    '<span style="font-size:11px;color:#fff;background:#e8590c;border-radius:4px;padding:1px 7px">' + esc(word) + '</span>' +
    '<span style="font-size:11px;color:#5a6472">\u4F8B\u53E5</span></div>' +
    '<div style="font-size:15px;line-height:1.6;color:#1f2630">' + esc(pick.en) + '</div>' +
    (pick.zh ? '<div style="font-size:13px;color:#5a6472;margin-top:3px;line-height:1.5">' + esc(pick.zh) + '</div>' : '') +
    '<span id="replayBadge" style="display:none;position:absolute;top:6px;right:8px;background:#e8590c;color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:1px 8px">+1</span>';
  bar.style.display = 'block';
}
function setReplayBadge(count) {
  var b = document.getElementById('replayBadge');
  if (!b) return;
  if (count > 0) { b.textContent = '+' + count; b.style.display = 'block'; }
  else { b.style.display = 'none'; }
}
function hideExampleBar() {
  var bar = document.getElementById('playExampleBar');
  if (bar) bar.style.display = 'none';
}
function stopHistPlay() {
  histPlaying = false;
  histPaused = false;
  histCancelTimer();
  if (histPlayAudio) { try { histPlayAudio.pause(); } catch (e) {} histPlayAudio = null; }
  histCurrent = null;
  histReplayCount = 0;
  setReplayBadge(0);
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; }
  document.getElementById('histPlay').textContent = '\u25B6 \u8FDE\u8BFB';
  document.getElementById('histStop').style.display = 'none';
  hideExampleBar();
  var els = historyList.querySelectorAll('[data-q]');
  for (var i = 0; i < els.length; i++) els[i].style.background = '';
}
function pauseHistPlay() {
  if (!histPlaying || histPaused) return;
  histPaused = true;
  histCancelTimer();
  if (histPlayAudio) { try { histPlayAudio.pause(); } catch (e) {} }
  document.getElementById('histPlay').textContent = '\u25B6 \u7EE7\u7EED';
}
function startCurrentWord() {
  if (!histPlaying || histPaused) return;
  if (!histCurrent) { stopHistPlay(); return; }
  histPlaySound(histPlayUrl(histCurrent.word, histCurrent.lang), function () {
    if (!histPlaying || histPaused) return;
    playRandomExample(histCurrent.word, histNext);
  });
}
function resumeHistPlay() {
  if (!histPlaying || !histPaused) return;
  histPaused = false;
  document.getElementById('histPlay').textContent = '\u23F8 \u6682\u505C';
  if (histPlayAudio && histPlayAudio.currentTime > 0 && !histPlayAudio.ended) {
    histPlayAudio.play().catch(function () { startCurrentWord(); });
  } else {
    startCurrentWord();
  }
}
function playRandomExample(word, done) {
  var tu = 'api/translate?q=' + encodeURIComponent(word) + '&from=auto&to=&' + 'token=' + encodeURIComponent(window.API_TOKEN || '');
  fetch(tu).then(function (r) { return r.json(); }).then(function (d) {
    if (!histPlaying || histPaused) return;
    var pool = (d && d.ok && d.examples && d.examples.length) ? d.examples : [];
    if (!pool.length) { histSchedule(done, 2000); return; }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var exUrl = pick.audio || histPlayUrl(pick.en, 'en');
    showExampleBar(word, pick);
    function chainReplay() {
      histSchedule(function () {
        if (!histPlaying || histPaused) return;
        histPlaySound(exUrl, function () {
          if (!histPlaying || histPaused) return;
          histReplayCount -= 1;
          setReplayBadge(histReplayCount);
          if (histReplayCount > 0) { chainReplay(); return; }
          histSchedule(done, 2000);
        });
      }, 1000);
    }
    histSchedule(function () {
      if (!histPlaying || histPaused) return;
      histPlaySound(exUrl, function () {
        if (!histPlaying || histPaused) return;
        if (histReplayCount > 0) { chainReplay(); return; }
        histSchedule(done, 2000);
      });
    }, 2000);
  }).catch(function () { if (histPlaying && !histPaused) histSchedule(done, 2000); });
}
function histNext() {
  if (!histPlaying) { stopHistPlay(); return; }
  if (histIdx >= histItems.length) { histIdx = 0; }
  var el = histItems[histIdx];
  for (var k = 0; k < histItems.length; k++) histItems[k].style.background = '';
  el.style.background = '#fff3e8';
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  var word = el.getAttribute('data-q') || '';
  var lang = /[A-Za-z]/.test(word.charAt(0)) ? 'en' : 'zh-CN';
  histCurrent = { word: word, lang: lang };
  histIdx += 1;
  histPlaySound(histPlayUrl(word, lang), function () {
    if (!histPlaying || histPaused) return;
    playRandomExample(word, histNext);
  });
}
document.getElementById('histPlay').addEventListener('click', function () {
  if (histPlaying && !histPaused) { pauseHistPlay(); return; }
  if (histPlaying && histPaused) { resumeHistPlay(); return; }
  var items = Array.prototype.slice.call(historyList.querySelectorAll('[data-q]'));
  if (!items.length) return;
  histItems = items;
  histIdx = 0;
  histPlaying = true;
  histPaused = false;
  this.textContent = '\u23F8 \u6682\u505C';
  document.getElementById('histStop').style.display = '';
  histNext();
});
document.getElementById('histStop').addEventListener('click', stopHistPlay);
document.getElementById('playExampleBar').addEventListener('click', function () {
  if (!histPlaying) return;
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; return; }
  histClickTimer = setTimeout(function () {
    histClickTimer = null;
    if (histPaused) { resumeHistPlay(); } else { pauseHistPlay(); }
  }, 260);
});
document.getElementById('playExampleBar').addEventListener('dblclick', function () {
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; }
  if (!histPlaying) return;
  histReplayCount += 1;
  setReplayBadge(histReplayCount);
  if (histPaused) { resumeHistPlay(); }
});
document.getElementById('histSort').addEventListener('click', function () {
  histSort = histSort === 'time' ? 'alpha' : 'time';
  this.textContent = histSort === 'time' ? '排序：时间' : '排序：字母';
  histOffset = 0;
  loadHistoryPage();
});
document.getElementById('histPrev').addEventListener('click', function () { if (histOffset > 0) { histOffset -= HIST_PAGE; loadHistoryPage(); } });
document.getElementById('histNext').addEventListener('click', function () { if (histOffset + HIST_PAGE < histTotal) { histOffset += HIST_PAGE; loadHistoryPage(); } });
document.getElementById('historyClose').addEventListener('click', function () { stopHistPlay(); historyOverlay.style.display = 'none'; });
historyOverlay.addEventListener('click', function (e) { if (e.target === historyOverlay) { stopHistPlay(); historyOverlay.style.display = 'none'; } });
historyList.addEventListener('click', function (e) {
  var item = e.target.closest('[data-q]');
  if (!item) return;
  historyOverlay.style.display = 'none';
  qEl.value = item.getAttribute('data-q') || '';
  translate();
});
qEl.addEventListener('keydown', function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) translate(); });
</script>
</body>
