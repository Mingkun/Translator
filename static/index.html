<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🦜 翻译鹦鹉</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="翻译鹦鹉">
<style>
  :root { --bg:#f7f9fc; --card:#ffffff; --text:#1f2630; --muted:#5a6472; --brand:#e8590c; --line:#dde4ec; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header .logo { font-size:30px; }
  header h1 { font-size:16px; margin:0; }
  header .sub { font-size:12px; color:var(--muted); }
  .input-card { background:#fff; border:2px solid #c4d0e8; border-radius:14px; padding:14px; box-shadow:0 4px 16px rgba(15,23,42,.10); }
  .row { display:flex; gap:8px; align-items:center; }
  textarea { width:100%; min-height:56px; max-height:120px; border:none; outline:none; resize:vertical; font-size:13px; background:#f0f4fa; border-radius:10px; padding:10px 12px; color:var(--text); box-sizing:border-box; }
  .lang-row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px dashed var(--line); }
  .lang { font-size:13px; color:var(--muted); }
  .swap { border:1px solid var(--line); background:#f0f4fa; border-radius:10px; padding:4px 12px; font-size:12px; cursor:pointer; color:#5a6472; }
  .go { width:100%; margin-top:10px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; padding:12px 0; cursor:pointer; box-shadow:0 2px 8px rgba(232,89,12,.3); }
  .go:active { opacity:.85; }
  .gosec { width:64px; margin-top:10px; border:1px solid var(--line); border-radius:10px; background:#f0f4fa; color:#5a6472; font-size:13px; font-weight:500; padding:4px 0; cursor:pointer; }
  .gosec:active { opacity:.8; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .trans-main { font-size:18px; font-weight:600; line-height:1.5; }
  .phonetic-row { display:flex; align-items:center; gap:10px; margin-top:6px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
  .speak { border:1px solid var(--line); background:#fff; border-radius:50%; width:30px; height:30px; font-size:14px; cursor:pointer; line-height:1; }
  .sec-title { font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .meaning { font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .meaning:last-child { border-bottom:none; }
  .meaning .pos { display:inline-block; font-size:11px; color:var(--brand); border:1px solid currentColor; border-radius:4px; padding:0 5px; margin-right:6px; vertical-align:1px; }
  .example { font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:flex-start; }
  .example:last-child { border-bottom:none; }
  .example .txt { flex:1; line-height:1.55; }
  .empty { color:var(--muted); font-size:14px; text-align:center; padding:30px 0; }
  .movie-tag { font-size:10px; color:#fff; background:#8746a8; border-radius:4px; padding:1px 5px; margin-left:6px; }
  .npage { position: absolute; top: 0; left: 0; right: 0; background: #fff; transform-origin: left center; font-size: 14px; line-height: 1.8; color: #1f2630; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .npage span { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .npage-in { animation: npageIn .6s ease-out; }
  @keyframes npageIn {
    0% { transform: scale(1.018); opacity: .55; }
    100% { transform: scale(1); opacity: 1; }
  }
  .err { color:#b02a37; font-size:14px; text-align:center; padding:16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logoBtn" style="cursor:pointer">🦜</div>
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <h1 style="margin:0">翻译鹦鹉</h1>
        <span id="quoteBar" style="font-size:11px;color:var(--muted);white-space:nowrap"></span>
      </div>
      <div class="sub">中英互译 · 音标 · 发音 · 例句</div>
    </div>
    <button type="button" id="sysBtn" style="margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text)">⚙</button>
  </header>

  <div id="result" style="flex:1;overflow-y:auto;padding-bottom:8px"></div>
<div id="trWordCard" style="display:none;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(420px,92vw);background:#fff;border:1px solid #dde4ec;border-radius:12px;padding:12px 14px;box-sizing:border-box;box-shadow:0 6px 24px rgba(15,23,42,.18);z-index:2600"></div>

  <div class="input-card">
    <div style="display:flex;gap:8px;align-items:stretch">
      <textarea id="q" placeholder="输入中文或英文…" autocomplete="off" style="flex:1;width:auto"></textarea>
      <button type="button" class="go" id="go" style="width:56px;margin-top:0;font-size:13px;padding:8px 0">翻译</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button type="button" class="gosec" id="ocrBtn" style="font-size:16px" title="截图翻译">📷</button>
      <button type="button" class="gosec" id="newsBtn" title="每日新闻">📰 新闻</button>
      <button type="button" class="gosec" id="movieBtn" title="影视库">🎬 影视</button>
      <button type="button" class="gosec" id="historyBtn" title="历史">🕘 历史</button>
    </div>
    <input type="file" id="imgInput" accept="image/*" style="display:none">
  </div>
  <div id="sysOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
  <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:16px;max-height:calc(100vh - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:15px">⚙ 系统</strong>
      <button type="button" id="sysClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
    </div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">📥 客户端下载</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <a href="downloads/translator-android-debug.apk" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px">
        <span style="font-size:22px">📱</span>
        <div><div>安卓客户端</div><div style="font-size:11px;color:var(--muted)">APK 安装包</div></div>
      </a>
      <a href="downloads/translator-windows-x64.zip" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px">
        <span style="font-size:22px">💻</span>
        <div><div>Windows 客户端</div><div style="font-size:11px;color:var(--muted)">ZIP 免安装绿色版</div></div>
      </a>
      <button type="button" id="iosPwaBtn" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--text);background:#fff;cursor:pointer;width:100%;box-sizing:border-box">
        <span style="font-size:22px">🍎</span>
        <div style="text-align:left"><div>iPhone 使用</div><div style="font-size:11px;color:var(--muted)">Safari 添加到主屏幕</div></div>
      </button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 2px 6px;">
      <span style="font-size:13px;color:var(--text)">👤 <span id="userName">…</span></span>
      <button type="button" id="logoutBtn" style="border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 12px;font-size:12px;cursor:pointer;color:#5a6472">退出登录</button>
    </div>
    <div id="mgrGroup" style="display:none">
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">👥 用户管理</div>
      <div style="background:#f6f8fb;border:1px solid #e3e8ef;border-radius:10px;padding:8px 12px">
        <button type="button" id="mgrRefresh" style="border:none;background:#e8590c;color:#fff;border-radius:8px;padding:6px 16px;font-size:12px;cursor:pointer;margin-bottom:6px">刷新用户统计</button>
        <div id="mgrUserList" style="font-size:12px"></div>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">🔤 翻译设置</div>
    <div style="background:#f6f8fb;border:1px solid var(--line);border-radius:12px;padding:2px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
        <span style="font-size:14px;">翻译方向　<span id="dirLabel" style="font-size:12px;color:var(--muted)">自动检测 → 自动</span></span>
        <button type="button" class="swap" id="swap">⇄ 切换</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">📈 行情设置</div>
    <div style="background:#f6f8fb;border:1px solid var(--line);border-radius:12px;padding:2px 14px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">显示行情</span>
      <button type="button" id="quoteOn" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:20px;padding:4px 18px;font-size:13px;cursor:pointer">开</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">股票代码</span>
      <input type="text" id="quoteCode" placeholder="HK02513 / 600519" style="width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-align:center" value="HK02513">
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">刷新周期(秒)</span>
      <input type="number" id="quoteInterval" min="3" max="60" style="width:64px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-align:center" value="3">
    </div>
    </div>
<div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">🔊 播放设置</div>
<div style="background:#f6f8fb;border:1px solid var(--line);border-radius:12px;padding:2px 14px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">播放内容</span>
      <div style="display:flex;gap:8px;">
        <button type="button" id="playModeBoth" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">单词+例句</button>
        <button type="button" id="playModeWord" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">仅单词</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">发音音色</span>
      <div style="display:flex;gap:8px;">
        <button type="button" id="voiceMale" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">男声</button>
        <button type="button" id="voiceFemale" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">女声</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">连续播放条数</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="number" id="playCount" min="1" max="200" value="20" style="width:64px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;">
        <span style="font-size:12px;color:var(--muted)">条</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">循环播放</span>
      <button type="button" id="playLoop" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:20px;padding:4px 18px;font-size:13px;cursor:pointer">关</button>
    </div>
    </div>
    <div style="font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 6px">🔄 版本与更新</div>
    <div style="background:#f6f8fb;border:1px solid #e3e8ef;border-radius:10px;padding:2px 12px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
        <span style="font-size:14px;">当前版本 <span id="trVer" style="font-size:12px;color:#5a6472">…</span></span>
        <button type="button" id="trCheckUp" style="border:none;background:#e8590c;color:#fff;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer">检查更新</button>
      </div>
      <div id="trUpInfo" style="font-size:12px;color:#5a6472;border-top:1px dashed #e3e8ef;padding:8px 0 10px"></div>
    </div>
  </div>
</div>
  
<div id="newsOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2100;align-items:center;justify-content:center;">
  <div style="width:min(440px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(75vh + 80px);display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:15px">📰 每日新闻</strong>
      <button type="button" id="newsClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
    </div>
    <div id="newsListView" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <input type="text" id="newsSearch" placeholder="搜索标题或内容…" style="border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;margin-bottom:8px">
      <div id="newsCats" style="display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;flex-shrink:0"></div>
      <div id="newsListBody" style="overflow:auto;flex:1"></div>
    </div>
    <div id="newsDetailView" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div id="newsDetailBody" style="overflow:auto;flex:1"></div>
      <div id="newsWordCard" style="display:none;margin-top:8px;background:#f6f8fb;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;position:relative"></div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:center">
        <button type="button" id="newsBack" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:#5a6472;width:80px;height:30px;line-height:28px;padding:0 14px;white-space:nowrap;box-sizing:border-box">返回</button>
        <button type="button" id="newsPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:#5a6472;width:80px;height:30px;line-height:28px;padding:0 14px;white-space:nowrap;box-sizing:border-box">▶ 播放</button>
        <button type="button" id="newsStop" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:#5a6472;display:none;width:80px;height:30px;line-height:28px;padding:0 14px;white-space:nowrap;box-sizing:border-box">⏹ 停止</button>
      </div>
    </div>
  </div>
</div>
<div id="loginOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:3000;align-items:center;justify-content:center;">
  <div style="width:min(340px,88vw);background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 32px rgba(15,23,42,.25)">
    <div style="text-align:center;margin-bottom:14px"><span style="font-size:38px">🦜</span><div style="font-size:16px;font-weight:600;color:#1f2630;margin-top:4px">翻译鹦鹉 · 用户登录</div></div>
    <input type="text" id="loginUser" placeholder="用户名" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #c4d0e8;border-radius:10px;font-size:15px;margin-bottom:10px;outline:none">
    <input type="password" id="loginPass" placeholder="密码" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #c4d0e8;border-radius:10px;font-size:15px;margin-bottom:14px;outline:none">
    <button type="button" id="loginBtn" style="width:100%;border:none;background:#e8590c;color:#fff;border-radius:10px;padding:11px 0;font-size:15px;font-weight:600;cursor:pointer">登 录</button>
    <div id="loginMsg" style="font-size:12px;color:#b02a37;text-align:center;margin-top:8px;min-height:16px"></div>
    <div style="text-align:center;margin-top:6px"><button type="button" id="loginSwitch" style="border:none;background:none;color:#7048a8;font-size:13px;cursor:pointer">没有账号？注册一个</button></div>
  </div>
</div>
<div id="movieOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
  <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(70vh + 80px);display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <strong style="font-size:15px">🎬</strong>
      <div style="display:flex;gap:6px;align-items:center;">
        <button type="button" id="mvPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--text)">▶ 连读</button>
        <button type="button" id="mvStop" style="display:none;border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:#b02a37">⏹</button>
        <button type="button" id="movieClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
      </div>
    </div>
    <div id="movieList" style="overflow:auto;flex:1"></div>
  </div>
</div>
<div id="historyOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
    <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(70vh + 80px);display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:15px">🕘</strong>
        <button type="button" id="histSort" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#5a6472">排序：时间</button>
        <button type="button" id="histPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#5a6472">▶ 连读</button>
        <button type="button" id="histStop" style="display:none;border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#b02a37">⏹ 停止</button>
        <button type="button" id="historyClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
      </div>
      <input type="text" id="histSearch" placeholder="🔍 输入关键词过滤…" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1.5px solid #c4d0e8;border-radius:10px;font-size:14px;margin-bottom:6px;background:#f0f4fa;outline:none" autocomplete="off">
      <div id="historyList" style="overflow:auto;flex:1"></div>
      <div id="histWordCard" style="display:none;margin:6px 0 4px;background:#f6f8fb;border:1px solid #dde4ec;border-radius:10px;padding:10px 12px;position:relative"></div>

function cacheSave(q, data) {
  var key = CACHE_PREFIX + q.trim().toLowerCase();
  try {
    localStorage.setItem(key, JSON.stringify(data));
    cacheKeys = cacheKeys.filter(function (k) { return k !== key; });
    cacheKeys.unshift(key);
    while (cacheKeys.length > CACHE_MAX) {
      var old = cacheKeys.pop();
      localStorage.removeItem(old);
    }
    localStorage.setItem('tr_cache_keys', JSON.stringify(cacheKeys));
  } catch (e) {}
}

function cacheLoad(q) {

function newsShatter(pgEl, done) {
  var rect = pgEl.getBoundingClientRect();
  var holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:5';
  pgEl.parentNode.appendChild(holder);
  var cols = 6, rows = 10;
  var sw = rect.width / cols, sh = rect.height / rows;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      (function (r, c) {
        var shard = document.createElement('div');
        shard.style.cssText = 'position:absolute;overflow:hidden;background:#fff;width:' + sw + 'px;height:' + sh + 'px;left:' + (c * sw) + 'px;top:' + (r * sh) + 'px;will-change:transform,opacity';
        var inner = pgEl.cloneNode(true);
        inner.style.cssText = 'position:absolute;left:' + (-c * sw) + 'px;top:' + (-r * sh) + 'px;width:' + rect.width + 'px;margin:0;min-height:0;display:block';
        shard.appendChild(inner);
        holder.appendChild(shard);
        var dx = (c - cols / 2 + 0.5) * (40 + Math.random() * 70);
        var dy = (r - rows / 2 + 0.5) * (25 + Math.random() * 45) + 140;
        var rot = (Math.random() - 0.5) * 200;
        var delay = 15 + Math.random() * 100;
        setTimeout(function () {
          shard.style.transition = 'transform .6s cubic-bezier(.3,.55,.7,1), opacity .6s ease-in';
          shard.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(.6)';
          shard.style.opacity = '0';
        }, delay);
      })(r, c);
    }

  pgEl.style.display = 'none';

    if (holder.parentNode) holder.parentNode.removeChild(holder);
    if (done) done();
  }, 750);
}
function newsFlipTo(pg, seekTime, holdAudio) {

function newsPaginate() {

  if (!body || !textEl) return;
  var spans = textEl.querySelectorAll('[data-nw]');

  var headHtml = '';

  while (child && child !== textEl) {
    headHtml += child.outerHTML;
    child = child.nextElementSibling;
  }
  var headEl = body.firstElementChild;
  var headH = (headEl && headEl !== textEl) ? Math.max(0, textEl.offsetTop - headEl.offsetTop) : 0;
  var total = Math.max(240, body.clientHeight - 8);
  var base = spans[0].offsetTop;
  var cap0 = Math.max(120, total - headH - 30);
  var pages = [];
  for (var i = 0; i < spans.length; i++) {
    var rel = spans[i].offsetTop - base;
    var pg = 0;
    if (rel > cap0) pg = 1 + Math.floor((rel - cap0) / (total - 30));
    if (!pages[pg]) pages[pg] = [];
    pages[pg].push(spans[i].outerHTML);
  }
  var html = '';
  for (var q = 0; q < pages.length; q++) {
    var inner = (q === 0 ? headHtml : '') + pages[q].join(' ');
    html += '<div class="npage" data-page="' + q + '" style="display:' + (q === 0 ? 'block' : 'none') + ';min-height:' + total + 'px">' + inner + '</div>';
  }

  wrap.style.perspective = '1400px';
  wrap.style.position = 'relative';
  wrap.style.height = total + 'px';

  while (body.firstElementChild && body.firstElementChild !== textEl) body.removeChild(body.firstElementChild);
  body.replaceChild(wrap, textEl);
}
function newsNormW(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function newsAlign(words, marks) {
  var n = words.length;
  var out = new Array(n);
  var i;
  if (!n || !marks.length) return out;
  var mi = 0;
  for (i = 0; i < n; i++) {
    var rw = newsNormW(words[i]);
    out[i] = null;
    if (!rw) continue;
    var hit = -1;
    var kmax = Math.min(mi + 4, marks.length);
    for (var k = mi; k < kmax; k++) {
      var mw = newsNormW(marks[k].w);
      if (mw && (rw === mw || rw.indexOf(mw) >= 0 || mw.indexOf(rw) >= 0)) { hit = k; break; }
    }
    if (hit >= 0) { out[i] = marks[hit].t; mi = hit + 1; }
  }
  var lastIdx = -1;
  for (i = 0; i < n; i++) {
    if (out[i] !== null && out[i] !== undefined) {
      if (lastIdx >= 0 && i - lastIdx > 1) {
        var t0 = out[lastIdx], t1 = out[i];
        for (var m = lastIdx + 1; m < i; m++) out[m] = t0 + (t1 - t0) * (m - lastIdx) / (i - lastIdx);
      } else if (lastIdx < 0) {
        for (var m2 = 0; m2 < i; m2++) out[m2] = out[i];
      }
      lastIdx = i;
    }
  }
  if (lastIdx >= 0 && lastIdx < n - 1) {
    var lastT = out[lastIdx] + 0.35;
    for (var m3 = lastIdx + 1; m3 < n; m3++) { out[m3] = lastT; lastT += 0.35; }
  }
  return out;
}
