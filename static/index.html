<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🦜 翻译鹦鹉</title>
<style>
  :root { --bg:#f7f9fc; --card:#ffffff; --text:#1f2630; --muted:#5a6472; --brand:#e8590c; --line:#dde4ec; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header .logo { font-size:30px; }
  header h1 { font-size:19px; margin:0; }
  header .sub { font-size:12px; color:var(--muted); }
  .input-card { background:#fff; border:2px solid #c4d0e8; border-radius:14px; padding:14px; box-shadow:0 4px 16px rgba(15,23,42,.10); }
  .row { display:flex; gap:8px; align-items:center; }
  textarea { width:100%; min-height:56px; max-height:120px; border:none; outline:none; resize:vertical; font-size:18px; background:#f0f4fa; border-radius:10px; padding:10px 12px; color:var(--text); box-sizing:border-box; }
  .lang-row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px dashed var(--line); }
  .lang { font-size:13px; color:var(--muted); }
  .swap { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .go { width:100%; margin-top:10px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; padding:12px 0; cursor:pointer; box-shadow:0 2px 8px rgba(232,89,12,.3); }
  .go:active { opacity:.85; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .trans-main { font-size:22px; font-weight:600; line-height:1.5; }
  .phonetic-row { display:flex; align-items:center; gap:10px; margin-top:6px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
  .speak { border:1px solid var(--line); background:#fff; border-radius:50%; width:30px; height:30px; font-size:14px; cursor:pointer; line-height:1; }
  .sec-title { font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .meaning { font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .meaning:last-child { border-bottom:none; }
  .meaning .pos { display:inline-block; font-size:11px; color:var(--brand); border:1px solid currentColor; border-radius:4px; padding:0 5px; margin-right:6px; vertical-align:1px; }
  .example { font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:flex-start; }
  .example:last-child { border-bottom:none; }
  .example .txt { flex:1; line-height:1.55; }
  .empty { color:var(--muted); font-size:14px; text-align:center; padding:30px 0; }
  .movie-tag { font-size:10px; color:#fff; background:#8746a8; border-radius:4px; padding:1px 5px; margin-left:6px; }
  .err { color:#b02a37; font-size:14px; text-align:center; padding:16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🦜</div>
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <h1 style="margin:0">翻译鹦鹉</h1>
        <span id="quoteBar" style="font-size:11px;color:var(--muted);white-space:nowrap"></span>
      </div>
      <div class="sub">中英互译 · 音标 · 发音 · 例句</div>
    </div>
    <button type="button" id="sysBtn" style="margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text)">⚙</button>
  </header>

  <div id="result" style="flex:1;overflow-y:auto;padding-bottom:8px"></div>

  <div class="input-card">
    <textarea id="q" placeholder="输入中文或英文…" autocomplete="off"></textarea>
    <div class="lang-row">
      <span class="lang" id="dirLabel">自动检测 → 自动</span>
      <button type="button" class="swap" id="swap">⇄ 切换方向</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button type="button" class="go" id="go" style="flex:1">翻 译</button>
      <button type="button" class="go" id="ocrBtn" style="width:64px;font-size:20px" title="截图翻译">📷</button>
      <button type="button" class="go" id="newsBtn" style="width:64px;font-size:13px" title="每日新闻">📰 新闻</button>
      <button type="button" class="go" id="movieBtn" style="width:64px;font-size:13px" title="影视库">🎬 影视</button>
      <button type="button" class="go" id="historyBtn" style="width:64px;font-size:13px" title="历史">🕘 历史</button>
    </div>
    <input type="file" id="imgInput" accept="image/*" style="display:none">
  </div>
  <div id="sysOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
  <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:16px;max-height:calc(100vh - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:15px">⚙ 系统</strong>
      <button type="button" id="sysClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
    </div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">客户端下载</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <a href="downloads/translator-android-debug.apk" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px">
        <span style="font-size:22px">📱</span>
        <div><div>安卓客户端</div><div style="font-size:11px;color:var(--muted)">APK 安装包</div></div>
      </a>
      <a href="downloads/translator-windows-x64.zip" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);font-size:14px">
        <span style="font-size:22px">💻</span>
        <div><div>Windows 客户端</div><div style="font-size:11px;color:var(--muted)">ZIP 免安装绿色版</div></div>
      </a>
    
    <div style="font-size:13px;color:var(--muted);margin:14px 0 8px">行情设置</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">显示行情</span>
      <button type="button" id="quoteOn" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:20px;padding:4px 18px;font-size:13px;cursor:pointer">开</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">股票代码</span>
      <input type="text" id="quoteCode" placeholder="HK02513 / 600519" style="width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-align:center" value="HK02513">
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">刷新周期(秒)</span>
      <input type="number" id="quoteInterval" min="3" max="60" style="width:64px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-align:center" value="3">
    </div>
<div style="font-size:13px;color:var(--muted);margin:14px 0 8px">播放设置</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);">
      <span style="font-size:14px;">播放内容</span>
      <div style="display:flex;gap:8px;">
        <button type="button" id="playModeBoth" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">单词+例句</button>
        <button type="button" id="playModeWord" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">仅单词</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">发音音色</span>
      <div style="display:flex;gap:8px;">
        <button type="button" id="voiceMale" style="border:1px solid var(--line);background:#e8590c;color:#fff;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">男声</button>
        <button type="button" id="voiceFemale" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">女声</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">连续播放条数</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="number" id="playCount" min="1" max="200" value="20" style="width:64px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;">
        <span style="font-size:12px;color:var(--muted)">条</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
      <span style="font-size:14px;">循环播放</span>
      <button type="button" id="playLoop" style="border:1px solid var(--line);background:#fff;color:var(--text);border-radius:20px;padding:4px 18px;font-size:13px;cursor:pointer">关</button>
    </div></div>
  </div>
</div>
  
<div id="newsOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2100;align-items:center;justify-content:center;">
  <div style="width:min(420px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(70vh + 80px);display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong style="font-size:15px">📰 每日新闻</strong>
      <button type="button" id="newsClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
    </div>
    <div id="newsBody" style="overflow:auto;flex:1"></div>
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:center">
      <button type="button" id="newsPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer;color:#5a6472">▶ 播放</button>
      <button type="button" id="newsStop" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer;color:#5a6472;display:none">⏹ 停止</button>
    </div>
  </div>
</div>
<div id="movieOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
  <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(70vh + 80px);display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <strong style="font-size:15px">🎬</strong>
      <div style="display:flex;gap:6px;align-items:center;">
        <button type="button" id="mvPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--text)">▶ 连读</button>
        <button type="button" id="mvStop" style="display:none;border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:#b02a37">⏹</button>
        <button type="button" id="movieClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
      </div>
    </div>
    <div id="movieList" style="overflow:auto;flex:1"></div>
  </div>
</div>
<div id="historyOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;">
    <div style="width:min(380px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:14px;max-height:calc(70vh + 80px);display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:15px">🕘</strong>
        <button type="button" id="histSort" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#5a6472">排序：时间</button>
        <button type="button" id="histPlay" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#5a6472">▶ 连读</button>
        <button type="button" id="histStop" style="display:none;border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;color:#b02a37">⏹ 停止</button>
        <button type="button" id="historyClose" style="border:none;background:none;font-size:22px;cursor:pointer;color:#5a6472;line-height:1">×</button>
      </div>
      <input type="text" id="histSearch" placeholder="🔍 输入关键词过滤…" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1.5px solid #c4d0e8;border-radius:10px;font-size:14px;margin-bottom:6px;background:#f0f4fa;outline:none" autocomplete="off">
      <div id="historyList" style="overflow:auto;flex:1"></div>
      <div id="playExampleBar" style="display:none;margin:6px 0 4px;background:#f6f8fb;border:1px solid #dde4ec;border-radius:10px;padding:10px 12px;box-sizing:border-box"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px">
        <button type="button" id="histPrev" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">上一页</button>
        <span id="histPage" style="font-size:12px;color:#5a6472">1 / 1</span>
        <button type="button" id="histNext" style="border:1px solid #c7d0dc;background:#fff;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">下一页</button>
      </div>
    </div>
  </div>

</div>

<script>
window.API_TOKEN = "__API_TOKEN__";
var dirMode = 'auto';
var qEl = document.getElementById('q');
var resultEl = document.getElementById('result');
var dirLabel = document.getElementById('dirLabel');
document.getElementById('swap').addEventListener('click', function () {
  dirMode = dirMode === 'auto' ? 'en2zh' : (dirMode === 'en2zh' ? 'zh2en' : 'auto');
  dirLabel.textContent = dirMode === 'auto' ? '自动检测 → 自动' : (dirMode === 'en2zh' ? '英语 → 中文' : '中文 → 英语');
});
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function audioBtn(url){ return url ? '<button type="button" class="speak" onclick="new Audio(\''+url+'\').play()">🔊</button>' : ''; }
function fromTo(){
  if (dirMode==='en2zh') return ['en','zh-CN'];
  if (dirMode==='zh2en') return ['zh-CN','en'];
  return ['auto',''];
}
var CACHE_MAX = 50;
var CACHE_PREFIX = 'tr_c_';
var cacheKeys = [];
try { cacheKeys = JSON.parse(localStorage.getItem('tr_cache_keys') || '[]'); } catch (e) { cacheKeys = []; }

function cacheSave(q, data) {
  var key = CACHE_PREFIX + q.trim().toLowerCase();
  try {
    localStorage.setItem(key, JSON.stringify(data));
    cacheKeys = cacheKeys.filter(function (k) { return k !== key; });
    cacheKeys.unshift(key);
    while (cacheKeys.length > CACHE_MAX) {
      var old = cacheKeys.pop();
      localStorage.removeItem(old);
    }
    localStorage.setItem('tr_cache_keys', JSON.stringify(cacheKeys));
  } catch (e) {}
}

function cacheLoad(q) {
  var key = CACHE_PREFIX + q.trim().toLowerCase();
  if (cacheKeys.indexOf(key) < 0) return null;
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}

function preloadHistoryCache() {
  var u = 'api/history?limit=50&sort=time&token=' + encodeURIComponent(window.API_TOKEN || '');
  fetch(u, { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var items = (d && d.items) || [];
      items.forEach(function (it) {
        var q = it.q;
        if (cacheLoad(q)) return;
        var tu = 'api/translate?q=' + encodeURIComponent(q) + '&from=auto&to=&token=' + encodeURIComponent(window.API_TOKEN || '');
        fetch(tu, { credentials: 'same-origin' })
          .then(function (r2) { return r2.json(); })
          .then(function (d2) { if (d2.ok) cacheSave(q, d2); })
          .catch(function () {});
      });
    })
    .catch(function () {});
}

var quoteEnabled = localStorage.getItem('tr_quoteOn') !== 'false';
var quoteCode = localStorage.getItem('tr_quoteCode') || 'HK02513';
var quoteInterval = parseInt(localStorage.getItem('tr_quoteInterval') || '3', 10) || 3;
var quoteTimer = null;

function updateQuoteUI() {
  var b = document.getElementById('quoteOn');
  if (!b) return;
  b.textContent = quoteEnabled ? '开' : '关';
  b.style.background = quoteEnabled ? '#e8590c' : '#fff';
  b.style.color = quoteEnabled ? '#fff' : 'var(--text)';
}

function fetchQuote() {
  if (!quoteEnabled || !quoteCode) return;
  var q = chr39('api/quote?code=') + encodeURIComponent(quoteCode) + chr39('&token=') + encodeURIComponent(window.API_TOKEN || '');
  fetch(q, { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var bar = document.getElementById('quoteBar');
      if (!bar) return;
      if (d.ok) {
        var pct = parseFloat(d.change_pct) || 0;
        var color = pct > 0 ? '#c92a2a' : (pct < 0 ? '#2f9e44' : 'var(--text)');
        bar.innerHTML = '<span style="color:' + color + '">' + esc(d.name) + ' ' + esc(d.price) + ' ' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%</span>';
      } else {
        bar.textContent = '行情获取失败';
      }
    })
    .catch(function () {});
}

function startQuoteLoop() {
  if (quoteTimer) clearInterval(quoteTimer);
  if (quoteEnabled) {
    fetchQuote();
    quoteTimer = setInterval(fetchQuote, quoteInterval * 1000);
  } else {
    var bar = document.getElementById('quoteBar');
    if (bar) bar.textContent = '';
  }
}

function chr39(s) { return s; }

if (document.getElementById('quoteOn')) document.getElementById('quoteOn').addEventListener('click', function () {
  quoteEnabled = !quoteEnabled;
  localStorage.setItem('tr_quoteOn', String(quoteEnabled));
  updateQuoteUI();
  startQuoteLoop();
});
if (document.getElementById('quoteCode')) {
  document.getElementById('quoteCode').value = quoteCode;
  document.getElementById('quoteCode').addEventListener('change', function () {
    quoteCode = this.value.trim() || 'HK02513';
    this.value = quoteCode;
    localStorage.setItem('tr_quoteCode', quoteCode);
    startQuoteLoop();
  });
}
if (document.getElementById('quoteInterval')) {
  document.getElementById('quoteInterval').value = quoteInterval;
  document.getElementById('quoteInterval').addEventListener('change', function () {
    quoteInterval = Math.max(3, Math.min(60, parseInt(this.value || '3', 10) || 3));
    this.value = quoteInterval;
    localStorage.setItem('tr_quoteInterval', String(quoteInterval));
    startQuoteLoop();
  });
}
updateQuoteUI();
startQuoteLoop();

var movieOverlay = document.getElementById('movieOverlay');
var movieList = document.getElementById('movieList');
var mvPlaying = false;
var mvPaused = false;
var mvAudio = null;
var mvTimer = null;
var mvItems = [];
var mvIdx = 0;
var mvClickTimer = null;
var mvSolo = { id: 0, count: 0, played: 0, audio: null, timer: null, playing: false };
var mvSelectedId = 0;
function mvSetSelected(id) {
  mvSelectedId = id;
  var els = movieList.querySelectorAll('[data-id]');
  for (var i = 0; i < els.length; i++) els[i].style.borderLeft = els[i].getAttribute('data-id') === String(id) ? '3px solid #e8590c' : '';
}
function mvBadgeSet(id, n) {
  var b = movieList.querySelector('[data-badge="' + id + '"]');
  if (b) b.textContent = n > 0 ? ('+' + n) : '';
}
function mvSoloStop() {
  if (mvSolo.timer) { clearTimeout(mvSolo.timer); mvSolo.timer = null; }
  if (mvSolo.audio) { try { mvSolo.audio.pause(); } catch (e) {} }
  var bid = mvSolo.id;
  mvSolo = { id: 0, count: 0, played: 0, audio: null, timer: null, playing: false };
  if (bid) mvBadgeSet(bid, 0);
}
function mvSoloPlay(id, count) {
  mvStopPlay();
  var item = null;
  for (var i = 0; i < mvItems.length; i++) if (mvItems[i].id === id) { item = mvItems[i]; break; }
  if (!item) return;
  mvSoloStop();
  mvSolo = { id: id, count: count, played: 0, audio: null, timer: null, playing: true };
  mvSetSelected(id);
  mvSoloNext();
}
function mvSoloNext() {
  if (!mvSolo.playing) return;
  if (mvSolo.played >= mvSolo.count) { mvSoloStop(); return; }
  var item = null;
  for (var i = 0; i < mvItems.length; i++) if (mvItems[i].id === mvSolo.id) { item = mvItems[i]; break; }

    var c = t.charCodeAt(i);
    if ((c === 46 || c === 33 || c === 63) && (i + 1 >= t.length || t.charAt(i + 1) === ' ')) {
      if (cur.trim().length > 2) { out.push(cur.trim()); cur = ''; }
    }
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

var histClickTimer = null;
function histPlayUrl(text, lang) {
  return 'api/tts?text=' + encodeURIComponent(text) + '&lang=' + lang + '&voice=' + ttsVoiceFor(lang) + '&token=' + encodeURIComponent(window.API_TOKEN || '');
}
function histSchedule(fn, ms) {
  histPlayTimer = setTimeout(function () { histPlayTimer = null; fn(); }, ms);
}
function histCancelTimer() {
  if (histPlayTimer) { clearTimeout(histPlayTimer); histPlayTimer = null; }
}
var histListClickTimer = null;
var histSelEl = null;
var histClicks = 0;
var histSolo = { q: '', count: 0, played: 0, audio: null, timer: null, playing: false };
function histEntryEl(q) {
  var els = historyList.querySelectorAll('[data-q]');
  for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-q') === q) return els[i];
  return null;
}
function histBadgeSet(q, n) {
  var el = histEntryEl(q);
  if (!el) return;
  var b = el.querySelector('[data-badge]');
  if (b) b.textContent = n > 0 ? ('+' + n) : '';
}
function histStopSelAudio() {
  if (histSolo.timer) { clearTimeout(histSolo.timer); histSolo.timer = null; }
  if (histSolo.audio) { try { histSolo.audio.pause(); } catch (e) {} }
  var bq = histSolo.q;
  histSolo = { q: '', count: 0, played: 0, audio: null, timer: null, playing: false };
  if (bq) {
    histBadgeSet(bq, 0);
    var bel = histFace(histEntryEl(bq));
    if (bel) bel.style.background = '#fff';
  }
}
function histSoloNext() {
  if (!histSolo.playing) return;
  if (histSolo.played >= histSolo.count) { histStopSelAudio(); return; }
  var q = histSolo.q;
  var lang = /[\u4e00-\u9fff]/.test(q) ? 'zh-CN' : 'en';
  var els = historyList.querySelectorAll('[data-q]');
  for (var k = 0; k < els.length; k++) { var fk = histFace(els[k]); if (fk) fk.style.background = '#fff'; }
  var el = histEntryEl(q);
  var ef = histFace(el);
  if (ef) ef.style.background = '#fff3d6';
  histBadgeSet(q, histSolo.count - histSolo.played);
  var a = new Audio(histPlayUrl(q, lang));
  histSolo.audio = a;
  var adv = function () {
    if (!histSolo.playing) return;
    histSolo.played++;
    if (histSolo.played >= histSolo.count) { histStopSelAudio(); return; }
    histSolo.timer = setTimeout(function () { histSoloNext(); }, 1000);
  };
  a.onended = adv;
  a.onerror = adv;
  a.play().catch(adv);
}
function histSetSelected(item) {
  histSelEl = item;
  var els = historyList.querySelectorAll('[data-q]');
  for (var i = 0; i < els.length; i++) els[i].style.borderLeft = els[i] === item ? '3px solid #e8590c' : '';
}
function histSelectPlay(item, count) {
  histStopSelAudio();
  histSetSelected(item);
  histSolo = { q: item.getAttribute('data-q') || '', count: count, played: 0, audio: null, timer: null, playing: true };
  histSoloNext();
}
function histSelectAdd(item) {
  var q = item.getAttribute('data-q') || '';
  if (histSolo.q === q && histSolo.playing) { histSolo.count++; histBadgeSet(q, histSolo.count - histSolo.played); return; }
  histSelectPlay(item, 2);
}
function histEnterTranslate(item) {
  histStopSelAudio();
  historyOverlay.style.display = 'none';
  qEl.value = item.getAttribute('data-q') || '';
  translate();
}
function histPlaySound(url, onDone) {
  histPlayAudio = new Audio(url);
  histPlayAudio.onended = onDone;
  histPlayAudio.onerror = function () { if (histPlaying && !histPaused) histSchedule(onDone, 400); };
  histPlayAudio.play().catch(function () { if (histPlaying && !histPaused) histSchedule(onDone, 400); });
}
function showExampleBar(word, pick) {
  var bar = document.getElementById('playExampleBar');
  if (!bar) return;
  bar.style.position = 'relative';
  bar.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
    '<span style="font-size:11px;color:#fff;background:#e8590c;border-radius:4px;padding:1px 7px">' + esc(word) + '</span>' +
    '<span style="font-size:11px;color:#5a6472">\u4F8B\u53E5</span></div>' +
    '<div style="font-size:15px;line-height:1.6;color:#1f2630">' + esc(pick.en) + '</div>' +
    (pick.zh ? '<div style="font-size:13px;color:#5a6472;margin-top:3px;line-height:1.5">' + esc(pick.zh) + '</div>' : '') +
    '<span id="replayBadge" style="display:none;position:absolute;top:6px;right:8px;background:#e8590c;color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:1px 8px">+1</span>';
  bar.style.display = 'block';
}
function setReplayBadge(count) {
  var b = document.getElementById('replayBadge');
  if (!b) return;
  if (count > 0) { b.textContent = '+' + count; b.style.display = 'block'; }
  else { b.style.display = 'none'; }
}
function hideExampleBar() {
  var bar = document.getElementById('playExampleBar');
  if (bar) bar.style.display = 'none';
}
function stopHistPlay() {
  histStopSelAudio();
  histPlaying = false;
  histPaused = false;
  histCancelTimer();
  if (histPlayAudio) { try { histPlayAudio.pause(); } catch (e) {} histPlayAudio = null; }
  histCurrent = null;
  histReplayCount = 0;
  setReplayBadge(0);
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; }
  document.getElementById('histPlay').textContent = '\u25B6 \u8FDE\u8BFB';
  document.getElementById('histStop').style.display = 'none';
  hideExampleBar();
  var els = historyList.querySelectorAll('[data-q]');
  for (var i = 0; i < els.length; i++) { var fi = histFace(els[i]); if (fi) fi.style.background = '#fff'; }
}
function pauseHistPlay() {
  if (!histPlaying || histPaused) return;
  histPaused = true;
  histCancelTimer();
  if (histPlayAudio) { try { histPlayAudio.pause(); } catch (e) {} }
  document.getElementById('histPlay').textContent = '\u25B6 \u7EE7\u7EED';
}
function startCurrentWord() {
  if (!histPlaying || histPaused) return;
  if (!histCurrent) { stopHistPlay(); return; }
  histPlaySound(histPlayUrl(histCurrent.word, histCurrent.lang), function () {
    if (!histPlaying || histPaused) return;
    playRandomExample(histCurrent.word, histNext);
  });
}
function resumeHistPlay() {
  if (!histPlaying || !histPaused) return;
  histPaused = false;
  document.getElementById('histPlay').textContent = '\u23F8 \u6682\u505C';
  if (histPlayAudio && histPlayAudio.currentTime > 0 && !histPlayAudio.ended) {
    histPlayAudio.play().catch(function () { startCurrentWord(); });
  } else {
    startCurrentWord();
  }
}
function playRandomExample(word, done) {
  var tu = 'api/translate?q=' + encodeURIComponent(word) + '&from=auto&to=&' + 'token=' + encodeURIComponent(window.API_TOKEN || '');
  fetch(tu).then(function (r) { return r.json(); }).then(function (d) {
    if (!histPlaying || histPaused) return;
    var pool = (d && d.ok && d.examples && d.examples.length) ? d.examples : [];
    if (!pool.length) { histSchedule(done, 2000); return; }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var exUrl = pick.audio || histPlayUrl(pick.en, 'en');
    showExampleBar(word, pick);
    function chainReplay() {
      histSchedule(function () {
        if (!histPlaying || histPaused) return;
        histPlaySound(exUrl, function () {
          if (!histPlaying || histPaused) return;
          histReplayCount -= 1;
          setReplayBadge(histReplayCount);
          if (histReplayCount > 0) { chainReplay(); return; }
          histSchedule(done, 2000);
        });
      }, 1000);
    }
    histSchedule(function () {
      if (!histPlaying || histPaused) return;
      histPlaySound(exUrl, function () {
        if (!histPlaying || histPaused) return;
        if (histReplayCount > 0) { chainReplay(); return; }
        histSchedule(done, 2000);
      });
    }, 2000);
  }).catch(function () { if (histPlaying && !histPaused) histSchedule(done, 2000); });
}
function histNext() {
  if (!histPlaying) { stopHistPlay(); return; }
  var limit = Math.min(histItems.length, playbackCount);
  if (histIdx >= limit) {
    if (playbackLoop) { histIdx = 0; } else { stopHistPlay(); return; }
  }
  var el = histItems[histIdx];
  for (var k = 0; k < histItems.length; k++) { var fk = histFace(histItems[k]); if (fk) fk.style.background = '#fff'; }
  var ef = histFace(el);
  if (ef) ef.style.background = '#fff3e8';
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  var word = el.getAttribute('data-q') || '';
  var lang = /[\u4e00-\u9fff]/.test(word) ? 'zh-CN' : 'en';
  histCurrent = { word: word, lang: lang };
  histIdx += 1;
  histPlaySound(histPlayUrl(word, lang), function () {
    if (!histPlaying || histPaused) return;
    if (playbackMode === 'word') { histSchedule(histNext, 2000); return; }
    playRandomExample(word, histNext);
  });
}
document.getElementById('histPlay').addEventListener('click', function () {
  if (histPlaying && !histPaused) { pauseHistPlay(); return; }
  if (histPlaying && histPaused) { resumeHistPlay(); return; }
  var items = Array.prototype.slice.call(historyList.querySelectorAll('[data-q]'));
  if (!items.length) return;
  histStopSelAudio();
  var startIdx = 0;
  if (histSelEl) { var pos = items.indexOf(histSelEl); if (pos >= 0) startIdx = pos; }
  histItems = items.slice(startIdx, startIdx + playbackCount);
  histIdx = 0;
  histPlaying = true;
  histPaused = false;
  this.textContent = '\u23F8 \u6682\u505C';
  document.getElementById('histStop').style.display = '';
  histNext();
});
document.getElementById('histStop').addEventListener('click', stopHistPlay);
document.getElementById('playExampleBar').addEventListener('click', function () {
  if (!histPlaying) return;
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; return; }
  histClickTimer = setTimeout(function () {
    histClickTimer = null;
    if (histPaused) { resumeHistPlay(); } else { pauseHistPlay(); }
  }, 260);
});
document.getElementById('playExampleBar').addEventListener('dblclick', function () {
  if (histClickTimer) { clearTimeout(histClickTimer); histClickTimer = null; }
  if (!histPlaying) return;
  histReplayCount += 1;
  setReplayBadge(histReplayCount);
  if (histPaused) { resumeHistPlay(); }
});
document.getElementById('histSort').addEventListener('click', function () {
  histSort = histSort === 'time' ? 'alpha' : 'time';
  this.textContent = histSort === 'time' ? '排序：时间' : '排序：字母';
  histOffset = 0;
  loadHistoryPage();
});
var histSearchTimer = null;
document.getElementById('histSearch').addEventListener('input', function () {
  var v = this.value;
  if (histSearchTimer) clearTimeout(histSearchTimer);
  histSearchTimer = setTimeout(function () {
    histFilter = v.trim().toLowerCase();
    histOffset = 0;
    loadHistoryPage();
  }, 300);
});
document.getElementById('histPrev').addEventListener('click', function () { if (histOffset > 0) { histOffset -= HIST_PAGE; loadHistoryPage(); } });
document.getElementById('histNext').addEventListener('click', function () { if (histOffset + HIST_PAGE < histTotal) { histOffset += HIST_PAGE; loadHistoryPage(); } });
document.getElementById('historyClose').addEventListener('click', function () { stopHistPlay(); historyOverlay.style.display = 'none'; });
historyOverlay.addEventListener('click', function (e) { if (e.target === historyOverlay) { stopHistPlay(); historyOverlay.style.display = 'none'; } });
historyList.addEventListener('click', function (e) {
  var delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    var dq = delBtn.getAttribute('data-del');
    if (!confirm('删除「' + dq + '」？')) return;
    var fd = new FormData();
    var delUrl = 'api/history/delete?token=' + encodeURIComponent(window.API_TOKEN || '');
    fetch(delUrl, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: dq }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) loadHistoryPage(); else alert(d.error || '删除失败'); })
      .catch(function () { alert('网络错误'); });
    return;
  }

  var item = e.target.closest('[data-q]');
  if (!item) return;
  if (histDragged) { histDragged = false; return; }
  if (histSwipeOpen) { histSwipeClose(); return; }
  histClicks++;
  if (histClicks === 1) {
    histListClickTimer = setTimeout(function () { histListClickTimer = null; histClicks = 0; histSelectPlay(item, 1); }, 300);
  } else if (histClicks === 2) {
    if (histListClickTimer) { clearTimeout(histListClickTimer); histListClickTimer = null; }
    histListClickTimer = setTimeout(function () { histListClickTimer = null; histClicks = 0; histSelectAdd(item); }, 300);
  } else {
    if (histListClickTimer) { clearTimeout(histListClickTimer); histListClickTimer = null; }
    histClicks = 0;
    histEnterTranslate(item);
  }
});
var histDragged = false;
var histSwipeOpen = null;
function histFace(el) { return (el && el.querySelector('.swipe-c')) || el; }
function histSwipeClose() {
  if (!histSwipeOpen) return;
  var c = histFace(histSwipeOpen);
  if (c) c.style.transform = '';
  histSwipeOpen = null;
}
function histSwipeDo(row, dx) {
  var c = histFace(row);
  if (c) c.style.transform = 'translateX(' + dx + 'px)';
}
var histSwipe = { row: null, sx: 0, sy: 0, dx: 0, active: false };
historyList.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 1) return;
  var t = e.touches[0];
  var row = t.target && t.target.closest ? t.target.closest('[data-swipe]') : null;
  histSwipe.row = row; histSwipe.sx = t.clientX; histSwipe.sy = t.clientY; histSwipe.dx = 0; histSwipe.active = false;
  if (row && histSwipeOpen && histSwipeOpen !== row) histSwipeClose();
}, { passive: true });
historyList.addEventListener('touchmove', function (e) {
  if (!histSwipe.row) return;
  var t = e.touches[0];
  var dx = t.clientX - histSwipe.sx;
  var dy = t.clientY - histSwipe.sy;
  if (!histSwipe.active && Math.abs(dy) > Math.abs(dx)) { histSwipe.row = null; return; }
  if (dx < 0) { histSwipe.active = true; histSwipe.dx = Math.max(dx, -64); histSwipeDo(histSwipe.row, histSwipe.dx); }
}, { passive: true });
historyList.addEventListener('touchend', function () {
  if (!histSwipe.row) return;
  if (histSwipe.active) {
    histDragged = true;
    if (histSwipe.dx < -32) { histSwipeDo(histSwipe.row, -56); histSwipeOpen = histSwipe.row; }
    else { histSwipeDo(histSwipe.row, 0); }
  }
  histSwipe.row = null;
}, { passive: true });
var histMouse = { row: null, sx: 0, sy: 0, dx: 0, down: false, active: false };
historyList.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  var row = e.target && e.target.closest ? e.target.closest('[data-swipe]') : null;
  if (!row) return;
  histMouse.row = row; histMouse.sx = e.clientX; histMouse.sy = e.clientY; histMouse.dx = 0; histMouse.down = true; histMouse.active = false;
  if (histSwipeOpen && histSwipeOpen !== row) histSwipeClose();
});
document.addEventListener('mousemove', function (e) {
  if (!histMouse.down || !histMouse.row) return;
  var dx = e.clientX - histMouse.sx;
  var dy = e.clientY - histMouse.sy;
  if (!histMouse.active) { if (Math.abs(dx) < 8 || Math.abs(dy) > Math.abs(dx)) return; }
  if (dx < 0) { histMouse.active = true; histMouse.dx = Math.max(dx, -64); histSwipeDo(histMouse.row, histMouse.dx); }
  else if (histMouse.active) { histMouse.dx = 0; histSwipeDo(histMouse.row, 0); }
});
document.addEventListener('mouseup', function () {
  if (!histMouse.down || !histMouse.row) { histMouse.down = false; return; }
  if (histMouse.active) {
    histDragged = true;
    if (histMouse.dx < -32) { histSwipeDo(histMouse.row, -56); histSwipeOpen = histMouse.row; }
    else { histSwipeDo(histMouse.row, 0); }
  }
  histMouse.down = false; histMouse.row = null;
});
qEl.addEventListener('keydown', function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) translate(); });
</script>
